      summary: Lift a block
      description: >
        The two are not friends again by this. Each can ask the other anew.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserReference"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/BlockNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /friends/blocked:
    get:
      operationId: listBlockedUsers
      tags: [Friends]
      summary: The users this user has blocked
      description: Nobody can see who has blocked them.
      responses:
        "200":
          description: Oldest block first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /duels:
    get:
      operationId: listDuels
      tags: [Competition]
      summary: The duels of the user, newest first (SRS FR-COMP-01)
      description: >
        Proposals in both directions, running duels and the ones that are over, at most 100. Of the
        opponent the user sees name and avatar, smoke-free days and check-ins, in a running duel who is
        ahead, and in a completed duel the reduction in whole percent. Never counts, limits or the baseline.
        When the two are not friends any more, the opponent and the opponent's side are `null`.
      responses:
        "200":
          description: The duels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: proposeDuel
      tags: [Competition]
      summary: Challenge a friend to a duel (SRS FR-COMP-01, FR-COMP-05)
      description: >
        The friend has 72 hours to accept. A user has at most one open duel with the same friend and at
        most 5 open duels in all: own proposals and running duels count, proposals from others do not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuelProposal"
      responses:
        "201":
          description: The proposal waits for the friend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Duel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FriendNotFound"
        "409":
          $ref: "#/components/responses/DuelRefused"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /duels/show:
    post:
      operationId: showDuel
      tags: [Competition]
      summary: One duel with its days (SRS FR-COMP-09)
      description: >
        The duel as in the list, and for every day of the duel that counts already how it went for both sides, as one of four levels. Days are numbered from 1, because the two users have calendars of their own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuelReference"
      responses:
        "200":
          description: The duel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DuelNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /duels/accept:
    post:
      operationId: acceptDuel
      tags: [Competition]
      summary: Accept a proposed duel (SRS FR-COMP-02)
      description: >
        Only the friend who was challenged, within 72 hours. The duel starts for each of the two on their own next local day and runs for exactly the number of days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuelReference"
      responses:
        "200":
          description: The duel is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Duel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DuelNotFound"
        "409":
          $ref: "#/components/responses/DuelNotOpen"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /duels/decline:
    post:
      operationId: declineDuel
      tags: [Competition]
      summary: Decline a proposed duel
      description: >
        Only the friend who was challenged. The duel stays in both lists as declined.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuelReference"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DuelNotFound"
        "409":
          $ref: "#/components/responses/DuelNotOpen"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /duels/cancel:
    post:
      operationId: cancelDuel
      tags: [Competition]
      summary: Take a proposal back
      description: >
        Only the challenger, and only while the proposal is open. It is deleted. A running duel cannot be given up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuelReference"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DuelNotFound"
        "409":
          $ref: "#/components/responses/DuelNotOpen"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /leagues:
    get:
      operationId: showLeague
      tags: [Competition]
      summary: The league of the user and their friends for one period (SRS FR-COMP-06, FR-COMP-08)
      description: >
        The user and their friends of today, ranked by reduction over a calendar period: more reduction,
        then more smoke-free days, then more check-ins; equal on all three share a rank. Somebody without
        a day that counts is listed last, without a rank.


        While the user's rank for the period is not stored yet (`final` is `false`), a friend is shown
        as ahead of the user, level or behind, without a rank and without a percentage: figures that move
        every day could be calculated back to daily counts. Of a friend only final days are shown and
        compared (two days old, not to be changed any more), and the comparison uses the user's own final
        days. The user's own figures follow the logs at once. The user's own rank and percentage are always
        there. Once `final` is `true`, everybody has a rank, and a friend with a final result over at
        least 7 days has a percentage.
      parameters:
        - name: type
          in: query
          required: true
          description: The kind of period.
          schema:
            $ref: "#/components/schemas/LeaguePeriodType"
        - name: period
          in: query
          required: true
          description: >
            `current`, or the key of a period that has begun: `2026-W47` (ISO week), `2026-11` (month),
            `2026-Q4` (quarter), `2026-H2` (half-year).
          schema:
            type: string
            pattern: "^(current|[0-9]{4}-(W(0[1-9]|[1-4][0-9]|5[0-3])|0[1-9]|1[0-2]|Q[1-4]|H[12]))$"
      responses:
        "200":
          description: The league.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LeagueNotFound"
        "409":
          $ref: "#/components/responses/PlanRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /leagues/xp:
    get:
      operationId: showXpLeague
      tags: [Competition]
      summary: The user and their friends by the XP of this week (SRS FR-COMP-07)
      description: >
        The XP that became final in the current ISO week of the user, for the user and every friend. The
        XP of a day counts when the day is final, two days after it. There is no reward for this ranking.
      responses:
        "200":
          description: The ranking, most XP first. The same XP shares a rank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpLeague"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PlanRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/login`, `POST /auth/verify-email` or `POST /auth/refresh`. Valid for 15 minutes.
  parameters:
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      description: >
        The refresh token of the web app. Set by `login` or `verifyEmail` with `refreshIn: cookie` and
        replaced by every `refreshSession`. The browser sends it by itself, and scripts cannot read it.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    RefreshCookie:
      description: >
        Only in cookie mode: `refresh_token=<token>; Max-Age=5184000; Path=/api/v1/auth; Secure; HttpOnly;
        SameSite=Strict`. On logout, and when a refresh cookie is refused, the same cookie with an empty
        value and `Max-Age=0`. Never sent when the refresh token travels in the body, and never to a request
        that did not bring the cookie.
      schema:
        type: string
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, cronLastRunAt]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Deployed release (git SHA)
        cronLastRunAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the cron job last ran through with every step working (UTC). `null` before the first
            such run, and where no heartbeat is kept (local development).
    EmailAddress:
      type: string
      maxLength: 254
      pattern: "^[ \\t\\n\\r\\x00\\x0B]*(?=[^ \\t\\n\\r\\x00\\x0B]{1,254}[ \\t\\n\\r\\x00\\x0B]*$)(?=[^@]{1,64}@)[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(\\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+[ \\t\\n\\r\\x00\\x0B]*$"
      description: >
        An ASCII address `local@host.tld`: at most 64 characters before the `@`, dot-separated parts of
        letters, digits and ``!#$%&'*+/=?^_`{|}~-``, a host of at least two labels, at most 254
        characters in all. No quoted local part, no address literal, no non-ASCII characters (the server
        is stricter than `format: email`). Compared without case and without the white space around it:
        ` Anna@Example.org ` and `anna@example.org` are the same address. Responses carry it lower-cased
        and trimmed.
      example: anna@example.org
    NewPassword:
      type: string
      format: password
      minLength: 10
      maxLength: 200
      description: >
        10 to 200 characters, counted in Unicode code points. Taken exactly as sent, nothing is trimmed.
        Must be valid UTF-8 (`invalid_format` otherwise, which JSON cannot produce).
    DisplayName:
      type: string
      minLength: 2
      maxLength: 30
      description: >
        What friends see. The spaces and tabs around it are removed first. Then: 2 to 30 characters
        (Unicode code points; `too_short` / `too_long`), at least 2 of them visible (letters, digits,
        punctuation or symbols: an emoji with its variation selector, or a letter with accents, is one;
        `too_short`), and none of these (`invalid_format`): control characters, line breaks, the
        bidirectional overrides, isolates and marks, and every other invisible format character
        (zero-width space, word joiner, soft hyphen, byte order mark, …). The zero-width joiner is
        allowed only inside an emoji sequence. Note that `minLength` / `maxLength` below apply to the
        text as sent: `"  A   "` passes them and is still `too_short`.
      example: Anna
    AvatarKey:
      type: string
      enum: [avatar-01, avatar-02, avatar-03, avatar-04, avatar-05, avatar-06,
             avatar-07, avatar-08, avatar-09, avatar-10, avatar-11, avatar-12]
      description: One of the preset avatars.
    Locale:
      type: string
      enum: [de, en]
      description: The language of the mails and push messages.
    TimeZoneName:
      type: string
      minLength: 1
      maxLength: 64
      description: >
        IANA time zone name, spelled exactly as in the tz database (case matters: `europe/berlin` is
        `invalid_value`). An older name that browsers still report (`Asia/Calcutta`) is accepted, and is
        stored and returned under the zone's current name (`Asia/Kolkata`). No offsets
        (`+01:00`) and no abbreviations (`CET`). The list is the one of the server's tz database: a zone
        newer than that is `invalid_value` until the server is updated, so fall back to a zone with the
        same rules. All day logic of the user runs in it. A change applies at once.
      example: Europe/Berlin
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName, avatar, locale, timeZone, consents]
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"
        password:
          $ref: "#/components/schemas/NewPassword"
        displayName:
          $ref: "#/components/schemas/DisplayName"
        avatar:
          $ref: "#/components/schemas/AvatarKey"
        locale:
          $ref: "#/components/schemas/Locale"
        timeZone:
          $ref: "#/components/schemas/TimeZoneName"
        consents:
          type: object
          additionalProperties: false
          required: [age18, art9, privacy]
          description: >
            All three must be given. Each is stored with the time and with the version of its text that
            the app showed and sent here (SRS FR-ACC-02, LEG-03).
          properties:
            age18:
              allOf:
                - $ref: "#/components/schemas/GivenConsent"
              description: The user confirms to be 18 or older.
            art9:
              allOf:
                - $ref: "#/components/schemas/GivenConsent"
              description: Explicit consent to the processing of smoking data, which is health data (GDPR Art. 9).
            privacy:
              allOf:
                - $ref: "#/components/schemas/GivenConsent"
              description: The user accepts the privacy policy.
    GivenConsent:
      type: object
      additionalProperties: false
      required: [accepted, version]
      description: One consent of a registration, with the version of the text it was given to.
      properties:
        accepted:
          type: boolean
          enum: [true]
          description: Must be literally `true` (`not_accepted` otherwise).
        version:
          type: string
          minLength: 1
          maxLength: 32
          description: >
            The version of the text the app displayed to the user, as the app has it. Must equal the
            version in force (`GET /legal/consents`), character for character: anything else is
            `outdated_version`, and the app has to be updated before the user can register.
          example: "2026-11"
    ConsentVersions:
      type: object
      additionalProperties: false
      required: [age18, art9, privacy]
      description: >
        The version in force of each consent text: 1 to 32 characters of letters, digits, `.`, `_` and `-`,
        the first a letter or a digit. Compare them as opaque text.
      properties:
        age18:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
          description: Of the wording of "I am 18 or older".
          example: "2026-11"
        art9:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
          description: Of the consent to the processing of smoking data (GDPR Art. 9).
          example: "2026-11"
        privacy:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
          description: Of the privacy policy.
          example: "2026-11"
    VerificationSent:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [verification_sent]
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token, password, refreshIn]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: The value of `token` in the link of the mail.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
          description: The password chosen at sign-up. Taken exactly as sent, nothing is trimmed.
        deviceLabel:
          type: string
          minLength: 1
          maxLength: 100
          description: As in `LoginRequest`.
          example: Annas iPhone
        refreshIn:
          type: string
          enum: [body, cookie]
          description: As in `LoginRequest`.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, refreshIn]
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
          description: Taken exactly as sent, nothing is trimmed.
        deviceLabel:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            What the client calls this device, to tell sessions apart. 1 to 100 characters after the
            spaces around it are removed, at least one of them visible, and the same forbidden characters
            as in a display name.
          example: Annas iPhone
        refreshIn:
          type: string
          enum: [body, cookie]
          description: >
            Where the refresh token is delivered: `body` for native apps, `cookie` for the web app.
    Session:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: "Send it in the Authorization header: `Bearer <accessToken>`."
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: >
            Seconds until the **access** token expires. The refresh token lives 60 days from its last use
            (the cookie's `Max-Age`).
          example: 900
        refreshToken:
          type: string
          description: >
            Only in body mode. In cookie mode this member is absent and the token is in the cookie.
            Opaque text of two base64url parts joined by a dot, at most 200 characters. Store it as it is.
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 200
          description: Body mode only. The web app sends no body, because its token is in the cookie.
    PasswordResetRequested:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [reset_requested]
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: The value of `token` in the link of the mail.
        password:
          $ref: "#/components/schemas/NewPassword"
    PasswordReset:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [password_reset]
    Me:
      type: object
      additionalProperties: false
      required: [id, email, displayName, avatar, locale, timeZone, onboardingComplete]
      properties:
        id:
          type: string
          format: uuid
        email:
          allOf:
            - $ref: "#/components/schemas/EmailAddress"
          description: Read-only. `PATCH /me` cannot change it.
        displayName:
          $ref: "#/components/schemas/DisplayName"
        avatar:
          $ref: "#/components/schemas/AvatarKey"
        locale:
          $ref: "#/components/schemas/Locale"
        timeZone:
          $ref: "#/components/schemas/TimeZoneName"
        onboardingComplete:
          type: boolean
          description: Whether the user has a reduction plan. `plan` is present exactly when this is `true`.
        plan:
          $ref: "#/components/schemas/CurrentPlan"
    GoalMode:
      type: string
      enum: [reduce, quit]
      description: "`reduce`: come down to `target` sessions per day and stay there. `quit`: come down to 0."
    TaperSpeed:
      type: string
      enum: [gentle, normal, fast]
      description: How far below the baseline the daily limit lies (SRS FR-PLAN-01).
    ProductType:
      type: string
      enum: [cigarette, rolled, cigar, pipe, shisha, vape, heated_tobacco, other]
      description: What the "+1" button logs unless the user picks something else.
    PlanTarget:
      type: integer
      minimum: 0
      maximum: 999
      description: >
        Sessions per day the user wants to reach. `reduce`: at least 1 and below the current baseline.
        `quit`: 0.
    CurrentPlan:
      type: object
      additionalProperties: false
      required: [goalMode, target, taperSpeed, defaultProduct, startDate, baseline, dailyLimit]
      properties:
        goalMode:
          $ref: "#/components/schemas/GoalMode"
        target:
          $ref: "#/components/schemas/PlanTarget"
        taperSpeed:
          $ref: "#/components/schemas/TaperSpeed"
        defaultProduct:
          $ref: "#/components/schemas/ProductType"
        startDate:
          type: string
          format: date
          description: The local day of the onboarding.
        baseline:
          type: number
          minimum: 0
          description: >
            The current baseline: the user's reference number of sessions per day, with one decimal
            place. It starts as the `startingBaseline` of the onboarding and follows the weekly update.
          example: 7.4
        dailyLimit:
          type: integer
          minimum: 0
          description: >
            Today's limit in sessions, derived from the baseline and from the goal and taper speed that
            are in force today.
          example: 5
        pendingFrom:
          type: string
          format: date
          description: >
            Present after a change of goal or taper speed that is not in force yet: the local day from
            which `goalMode`, `target` and `taperSpeed` count. Until then `dailyLimit` follows the plan
            as it was (SRS FR-I18N-02).
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
        avatar:
          $ref: "#/components/schemas/AvatarKey"
        locale:
          $ref: "#/components/schemas/Locale"
        timeZone:
          $ref: "#/components/schemas/TimeZoneName"
    PlanRequest:
      type: object
      additionalProperties: false
      required: [goalMode, target, taperSpeed, defaultProduct]
      properties:
        startingBaseline:
          type: integer
          minimum: 1
          maximum: 80
          description: >
            How many sessions per day the user has now, as a whole number. Required in the first call.
            Later calls leave it out or repeat the same value.
          example: 12
        goalMode:
          $ref: "#/components/schemas/GoalMode"
        target:
          $ref: "#/components/schemas/PlanTarget"
        taperSpeed:
          $ref: "#/components/schemas/TaperSpeed"
        defaultProduct:
          $ref: "#/components/schemas/ProductType"
    DeleteMeRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
          description: The current password, exactly as typed.
    AccountExport:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - exportedAt
        - profile
        - consents
        - planHistory
        - baselineHistory
        - timeZoneHistory
        - smokeLogs
        - days
        - xpEvents
        - friends
        - blockedUsers
        - duels
        - leagueResults
        - badges
        - healthMilestones
        - settings
        - feedEvents
        - reactionsSent
        - sessions
        - mailLinks
        - queuedMails
      description: >
        Everything the server stores about the user. Every table with user data has its member here, and
        a later version of the API adds members. Times are UTC. `plan` and `progress` are absent before
        the onboarding, `inviteCode` before the first `GET /me/invite`.
      properties:
        formatVersion:
          type: integer
          enum: [1]
        exportedAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/ExportedProfile"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ExportedConsent"
        plan:
          $ref: "#/components/schemas/ExportedPlan"
        planHistory:
          type: array
          description: >
            What the plan said from which local day on, oldest first. A change of goal or taper speed
            counts from the next local day.
          items:
            $ref: "#/components/schemas/ExportedPlanTerms"
        baselineHistory:
          type: array
          description: Every baseline the user ever had, oldest first.
          items:
            $ref: "#/components/schemas/ExportedBaseline"
        timeZoneHistory:
          type: array
          description: >
            The time zones of the user since the onboarding, oldest first. The days of the user are
            counted in them. A change counts from the next local day.
          items:
            $ref: "#/components/schemas/ExportedZoneChange"
        smokeLogs:
          type: array
          description: Every log, in the order of `smokedAt`. A deleted log stays stored and has `deletedAt`.
          items:
            $ref: "#/components/schemas/ExportedSmokeLog"
        days:
          type: array
          description: The days that have a log or a check-in, and every day that is final, oldest first.
          items:
            $ref: "#/components/schemas/ExportedDay"
        progress:
          $ref: "#/components/schemas/ExportedProgress"
        xpEvents:
          type: array
          description: Every XP award, by day.
          items:
            $ref: "#/components/schemas/ExportedXpEvent"
        sessions:
          type: array
          description: The logins of the user's devices, one entry per login. At most 20 are kept per user.
          items:
            $ref: "#/components/schemas/ExportedSession"
        mailLinks:
          type: array
          description: >
            The confirmation and password reset links that were made for the user and not cleaned up
            yet. Their mails are sent a minute or two after the request.
          items:
            $ref: "#/components/schemas/ExportedMailLink"
        queuedMails:
          type: array
          description: >
            The mails to the user that wait to be sent, oldest first. Usually empty: a mail goes out
            within a minute or two and is deleted from the server as soon as the mail server has it.
            They go to the address of the profile.
          items:
            $ref: "#/components/schemas/ExportedQueuedMail"
        inviteCode:
          $ref: "#/components/schemas/ExportedInvite"
        friends:
          type: array
          description: Friendships and open friend requests, oldest request first.
          items:
            $ref: "#/components/schemas/ExportedFriend"
        blockedUsers:
          type: array
          description: The users this user has blocked, oldest block first. Not who has blocked this user.
          items:
            $ref: "#/components/schemas/ExportedBlock"
        duels:
          type: array
          description: The duels of the user, oldest first.
          items:
            $ref: "#/components/schemas/ExportedDuel"
        leagueResults:
          type: array
          description: The user's final results of the league periods, oldest first.
          items:
            $ref: "#/components/schemas/ExportedLeagueResult"
        badges:
          type: array
          description: The badges of the user, in the order of `BadgeKey`.
          items:
            $ref: "#/components/schemas/Badge"
        healthMilestones:
          type: array
          description: >
            The health milestones the user has reached at some time, as stored for what friends may
            see, in the order of `HealthMilestoneKey`.
          items:
            $ref: "#/components/schemas/ReachedHealthMilestone"
        settings:
          $ref: "#/components/schemas/Settings"
        feedEvents:
          type: array
          description: The entries of the activity feed about the user, oldest first.
          items:
            $ref: "#/components/schemas/ExportedFeedEvent"
        reactionsSent:
          type: array
          description: The reactions the user sent, oldest first, each with the id of the user whose entry it was.
          items:
            $ref: "#/components/schemas/ExportedReaction"
    ExportedProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName, avatar, locale, timeZone, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/EmailAddress"
        displayName:
          $ref: "#/components/schemas/DisplayName"
        avatar:
          $ref: "#/components/schemas/AvatarKey"
        locale:
          $ref: "#/components/schemas/Locale"
        timeZone:
          $ref: "#/components/schemas/TimeZoneName"
        emailVerifiedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ExportedConsent:
      type: object
      additionalProperties: false
      required: [type, version, grantedAt]
      properties:
        type:
          type: string
          enum: [age18, art9, privacy]
        version:
          type: string
          description: The version of the text the user agreed to, as the app sent it at registration.
        grantedAt:
          type: string
          format: date-time
    ExportedPlan:
      type: object
      additionalProperties: false
      required: [goalMode, target, taperSpeed, defaultProduct, startDate, rulesVersion]
      properties:
        goalMode:
          $ref: "#/components/schemas/GoalMode"
        target:
          $ref: "#/components/schemas/PlanTarget"
        taperSpeed:
          $ref: "#/components/schemas/TaperSpeed"
        defaultProduct:
          $ref: "#/components/schemas/ProductType"
        startDate:
          type: string
          format: date
        rulesVersion:
          type: string
          description: The version of the rule table that was in force when the plan was made.
    ExportedBaseline:
      type: object
      additionalProperties: false
      required: [validFrom, value, source, weekMean, monthMean, weekDays, monthDays, rulesVersion]
      properties:
        validFrom:
          type: string
          format: date
          description: The local day from which the value counts.
        value:
          type: number
          minimum: 0
          description: Sessions per day, with one decimal place.
        source:
          type: string
          enum: [onboarding, weekly, unchanged_low_data, capped]
        weekMean:
          type: number
          nullable: true
          description: >
            Input of the weekly update: mean sessions per day over the checked-in days of the week
            before. `null` for the onboarding value.
        monthMean:
          type: number
          nullable: true
          description: The same over the 28 days before.
        weekDays:
          type: integer
          nullable: true
          description: How many checked-in days went into `weekMean`.
        monthDays:
          type: integer
          nullable: true
          description: How many checked-in days went into `monthMean`.
        rulesVersion:
          type: string
          description: The version of the rule table the value was calculated with.
    Day:
      type: object
      additionalProperties: false
      required: [date, count, limit, remaining, checkedIn, status]
      properties:
        date:
          type: string
          format: date
          description: A local day of the user.
        count:
          type: integer
          minimum: 0
          description: Sessions of the day.
        limit:
          type: integer
          minimum: 0
          description: The limit of that day.
        remaining:
          type: integer
          minimum: 0
          description: What is left of the limit. 0 when the count is at or over it, never negative.
        checkedIn:
          type: boolean
        status:
          type: string
          enum: [provisional, final]
          description: "`final` 48 hours after the day ended: nothing about it changes any more."
    DayList:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          maxItems: 92
          items:
            $ref: "#/components/schemas/Day"
    Streak:
      type: object
      additionalProperties: false
      required: [current, longest]
      properties:
        current:
          type: integer
          minimum: 0
        longest:
          type: integer
          minimum: 0
    Progress:
      type: object
      additionalProperties: false
      required: [checkInStreak, underLimitStreak, freezes, xp, level, provisional]
      properties:
        checkInStreak:
          $ref: "#/components/schemas/Streak"
        underLimitStreak:
          $ref: "#/components/schemas/Streak"
        freezes:
          type: integer
          minimum: 0
          description: Streak freezes held.
        xp:
          type: integer
          minimum: 0
          description: The XP total.
        level:
          type: object
          additionalProperties: false
          required: [number, xpIntoLevel, xpForNextLevel]
          properties:
            number:
              type: integer
              minimum: 0
            xpIntoLevel:
              type: integer
              minimum: 0
              description: XP earned since this level was reached.
            xpForNextLevel:
              type: integer
              minimum: 1
              description: The whole distance from this level to the next one.
        provisional:
          type: boolean
          description: >
            `true` when days that are not final yet are counted in and change something. Their logs can
            still be corrected, so these numbers can still move.
    Dashboard:
      type: object
      additionalProperties: false
      required: [today, progress]
      properties:
        today:
          $ref: "#/components/schemas/Day"
        progress:
          $ref: "#/components/schemas/Progress"
    CheckInResult:
      type: object
      additionalProperties: false
      required: [day, events, progress]
      properties:
        day:
          $ref: "#/components/schemas/Day"
        events:
          type: array
          description: What the day gives to celebrate as things stand, in the order to play it.
          items:
            $ref: "#/components/schemas/DayEvent"
        progress:
          $ref: "#/components/schemas/Progress"
    BaselineHistory:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ExportedBaseline"
    LogItem:
      type: object
      additionalProperties: false
      required: [id]
      description: >
        A log (`smokedAt`, `productType` and `count`, all three) or a deletion (`deleted: true` and
        nothing else).
      properties:
        id:
          type: string
          format: uuid
          description: Made by the app when the log is made, and never used for another log.
        smokedAt:
          type: string
          format: date-time
          description: When it happened, with a UTC offset. Fractions of a second are dropped.
          example: "2026-11-17T08:15:00Z"
        productType:
          $ref: "#/components/schemas/ProductType"
        count:
          type: integer
          minimum: 1
          maximum: 50
          description: Sessions of this log.
        deleted:
          type: boolean
          enum: [true]
    LogSyncRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/LogItem"
    LogItemResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, rejected]
        reason:
          type: string
          enum: [day_finalized, in_future, before_start, day_full, not_yours]
          description: >
            Only with `rejected`. `day_finalized`: the day of the log (or the day it would move to) is
            final. `in_future`: `smokedAt` is more than 5 minutes ahead of the server's clock.
            `before_start`: before the first day of the plan. `day_full`: the day would hold more than
            300 sessions. `not_yours`: the id cannot be used by this account.
    LogSyncResult:
      type: object
      additionalProperties: false
      required: [results, days]
      properties:
        results:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/LogItemResult"
        days:
          type: array
          items:
            $ref: "#/components/schemas/Day"
    ExportedPlanTerms:
      type: object
      additionalProperties: false
      required: [validFrom, goalMode, target, taperSpeed, rulesVersion]
      properties:
        validFrom:
          type: string
          format: date
          description: The local day from which these terms count.
        goalMode:
          $ref: "#/components/schemas/GoalMode"
        target:
          $ref: "#/components/schemas/PlanTarget"
        taperSpeed:
          $ref: "#/components/schemas/TaperSpeed"
        rulesVersion:
          type: string
    ExportedZoneChange:
      type: object
      additionalProperties: false
      required: [validFrom, timeZone]
      properties:
        validFrom:
          type: string
          format: date
          description: The local day from which the zone counts.
        timeZone:
          type: string
          description: IANA time zone name.
    ExportedSmokeLog:
      type: object
      additionalProperties: false
      required: [id, smokedAt, localDate, productType, count, createdAt, updatedAt, deletedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The id the app gave the log.
        smokedAt:
          type: string
          format: date-time
        localDate:
          type: string
          format: date
          description: The day of the user the log counts for, worked out by the server.
        productType:
          $ref: "#/components/schemas/ProductType"
        count:
          type: integer
          minimum: 1
          maximum: 50
        createdAt:
          type: string
          format: date-time
          description: When the server first stored the log.
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    DayEventType:
      type: string
      enum:
        - checked_in
        - under_limit_day
        - smoke_free_day
        - streak_extended
        - streak_milestone
        - freeze_earned
        - freeze_used
        - streak_broken
        - level_up
      description: >
        What a day gives the user to see and hear. `under_limit_day`: value = the new under-limit streak.
        `streak_extended`: the new check-in streak. `streak_milestone`: the milestone reached, in days.
        `freeze_earned` and `freeze_used`: the freezes held afterwards. `streak_broken`: the length the
        check-in streak had. `level_up`: the level reached, one event per level. `checked_in` and
        `smoke_free_day` have no value. New values may be added: an app ignores what it does not know.
    DayEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/DayEventType"
        value:
          type: integer
          minimum: 0
          description: Absent for the types that have none.
    ExportedDay:
      type: object
      additionalProperties: false
      required: [date, count, checkedInAt, dailyLimit, xp, events, freezeUsed, finalizedAt, rulesVersion]
      description: >
        One day of the user. `dailyLimit`, `xp`, `events`, `freezeUsed`, `finalizedAt` and `rulesVersion`
        are written when the day becomes final, 48 hours after it ended, and are `null` before.
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
          minimum: 0
          description: Sessions of the day, which is the sum of the counts of its logs that are not deleted.
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        dailyLimit:
          type: integer
          minimum: 0
          nullable: true
        xp:
          type: integer
          minimum: 0
          nullable: true
        events:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/DayEvent"
        freezeUsed:
          type: boolean
          nullable: true
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        rulesVersion:
          type: string
          nullable: true
    ExportedProgress:
      type: object
      additionalProperties: false
      required:
        - checkInStreak
        - longestCheckInStreak
        - underLimitStreak
        - longestUnderLimitStreak
        - freezesHeld
        - xpTotal
        - level
        - nextDayToFinalize
      description: What the user has built up over the days that are final.
      properties:
        checkInStreak:
          type: integer
          minimum: 0
        longestCheckInStreak:
          type: integer
          minimum: 0
        underLimitStreak:
          type: integer
          minimum: 0
        longestUnderLimitStreak:
          type: integer
          minimum: 0
        freezesHeld:
          type: integer
          minimum: 0
        xpTotal:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 0
        nextDayToFinalize:
          type: string
          format: date
          description: Every day before this one is final.
    ExportedXpEvent:
      type: object
      additionalProperties: false
      required: [date, source, amount, detail, createdAt]
      properties:
        date:
          type: string
          format: date
          description: The day of the user the XP was earned on.
        source:
          type: string
          enum: [check_in, under_limit, smoke_free, streak_milestone, duel, league, reaction]
        amount:
          type: integer
          minimum: 1
        detail:
          type: integer
          minimum: 0
          nullable: true
          description: The streak length for `streak_milestone`, the rank for `league`. `null` otherwise.
        createdAt:
          type: string
          format: date-time
    ExportedSession:
      type: object
      additionalProperties: false
      required: [session, deviceLabel, createdAt, lastRefreshedAt, expiresAt, revokedAt]
      properties:
        session:
          type: string
          format: uuid
          description: Identifies the login.
        deviceLabel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: When the device logged in.
        lastRefreshedAt:
          type: string
          format: date-time
          nullable: true
          description: When the refresh token of this login was last exchanged. `null` when it never was.
        expiresAt:
          type: string
          format: date-time
          description: Until when the login can be refreshed. Each refresh adds 60 days.
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: When the login was ended.
    ExportedMailLink:
      type: object
      additionalProperties: false
      required: [purpose, expiresAt, usedAt]
      properties:
        purpose:
          type: string
          enum: [verify_email, reset_password]
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
    ExportedQueuedMail:
      type: object
      additionalProperties: false
      required: [template, createdAt, attempts]
      properties:
        template:
          type: string
          enum: [confirm_email, already_registered, reset_password]
          description: >
            Which mail it is: the confirmation link, the note that the address already has an account,
            or the password reset link. The content (the link) is never exported.
        createdAt:
          type: string
          format: date-time
          description: When the mail was queued, which is the time of the request that caused it.
        attempts:
          type: integer
          minimum: 0
          description: How often the mail server did not take the mail so far. After the fifth time the mail is dropped.
    InviteCode:
      type: string
      pattern: "^[2-9A-HJ-NP-Za-hj-np-z]{10}$"
      description: >
        Ten characters out of `23456789ABCDEFGHJKLMNPQRSTUVWXYZ` (no 0, 1, I or O, which are easily
        mixed up). The server answers in capitals and takes small letters too.
      example: K7M2QX9RTB
    Invite:
      type: object
      additionalProperties: false
      required: [code, url]
      properties:
        code:
          type: string
          pattern: "^[2-9A-HJ-NP-Z]{10}$"
        url:
          type: string
          format: uri
          description: >
            The link to share: the address of the app with the code after a `#`, which a browser never
            sends to a server. It opens the app, which sends the friend request with the code.
    PublicUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, avatar]
      description: What one user sees of another before they are friends, and never more than this.
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatar:
          $ref: "#/components/schemas/AvatarKey"
    Friend:
      type: object
      additionalProperties: false
      required: [user, since, level, xp, checkInStreak, underLimitStreak, badges, healthMilestones]
      description: >
        A friend and the aggregates friends see of each other (SRS FR-FRND-03), as stored when the
        friend's last day became final. All zero for a friend who has not done the onboarding.
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        since:
          type: string
          format: date-time
          description: When the request was accepted.
        level:
          type: integer
          minimum: 0
        xp:
          type: integer
          minimum: 0
        checkInStreak:
          $ref: "#/components/schemas/Streak"
        underLimitStreak:
          $ref: "#/components/schemas/Streak"
        badges:
          type: array
          maxItems: 17
          description: >
            The badges the friend holds, in the order of `BadgeKey`. Which ones, and never when they
            were earned: the day of a first smoke-free day would be a day with a known count.
          items:
            $ref: "#/components/schemas/BadgeKey"
        healthMilestones:
          type: array
          maxItems: 8
          description: >
            The health milestones the friend has reached at some time and lets friends see (the
            friend's own setting, `MilestoneSharing`), in the order of `HealthMilestoneKey`. Worked out
            from final days, kept for good and shown without a time: a session of today, or a relapse,
            cannot be read from it.
          items:
            $ref: "#/components/schemas/HealthMilestoneKey"
    FeedEntryType:
      type: string
      description: >
        `level_up` (with `level`), `badge_earned` (with `badge`; the check-in streaks of 7, 30, 100 and
        365 days are in the feed as their badges), `duel_won` and `duel_draw` (with `opponent`, if the
        user may see who it was), `health_milestone` (with `milestone`). A later version of the API may
        add types: an app leaves out what it does not know.
      enum: [level_up, badge_earned, duel_won, duel_draw, health_milestone]
    FeedEntry:
      type: object
      additionalProperties: false
      required: [id, type, user, mine, level, badge, milestone, opponent, myReaction, reactions]
      description: One thing somebody reached. It has no time on purpose (SRS FR-FRND-03).
      properties:
        id:
          type: string
          format: uuid
          description: Random. It says nothing about when the entry was written.
        type:
          $ref: "#/components/schemas/FeedEntryType"
        user:
          $ref: "#/components/schemas/PublicUser"
        mine:
          type: boolean
          description: Whether the entry is about the user who asks.
        level:
          type: integer
          minimum: 1
          nullable: true
          description: The level reached, for `level_up`. Two levels reached in one step are one entry.
        badge:
          allOf:
            - $ref: "#/components/schemas/BadgeKey"
          nullable: true
        milestone:
          allOf:
            - $ref: "#/components/schemas/HealthMilestoneKey"
          nullable: true
        opponent:
          allOf:
            - $ref: "#/components/schemas/PublicUser"
          nullable: true
          description: >
            Of a duel: the other user, if that is the user who asks or a friend of theirs. `null`
            otherwise, and when the other account does not exist any more.
        myReaction:
          allOf:
            - $ref: "#/components/schemas/ReactionKey"
          nullable: true
          description: The reaction of the user who asks to this entry, if there is one.
        reactions:
          type: array
          maxItems: 50
          description: >
            Who reacted, oldest first: only on an entry of the user who asks, and only reactions of
            users who are friends now. Empty on every entry of somebody else.
          items:
            $ref: "#/components/schemas/FeedReaction"
    ReactionKey:
      type: string
      description: "`cheer` (👏), `strong` (💪), `keep_going` (🔥). There is no free text (SRS FR-SOC-02)."
      enum: [cheer, strong, keep_going]
    FeedReaction:
      type: object
      additionalProperties: false
      required: [user, reaction]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        reaction:
          $ref: "#/components/schemas/ReactionKey"
    ReactionRequest:
      type: object
      additionalProperties: false
      required: [entryId, reaction]
      properties:
        entryId:
          type: string
          format: uuid
          description: The `id` of an entry of `GET /feed`. In the body, like every id (HLD §4.7).
        reaction:
          $ref: "#/components/schemas/ReactionKey"
    ReactionResult:
      type: object
      additionalProperties: false
      required: [reaction, xp]
      properties:
        reaction:
          $ref: "#/components/schemas/ReactionKey"
        xp:
          type: integer
          minimum: 0
          description: >
            What this reaction earned: 0 for a changed reaction, above the daily maximum, and before the
            onboarding.
    ExportedReaction:
      type: object
      additionalProperties: false
      required: [userId, reaction, createdAt]
      properties:
        userId:
          type: string
          format: uuid
          description: >
            In `reactionsSent`: whose entry it was. In the `reactions` of an exported feed entry: who
            reacted.
        reaction:
          $ref: "#/components/schemas/ReactionKey"
        createdAt:
          type: string
          format: date-time
    Feed:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/FeedEntry"
    ExportedFeedEvent:
      type: object
      additionalProperties: false
      required: [type, detail, opponentId, createdAt, reactions]
      properties:
        type:
          $ref: "#/components/schemas/FeedEntryType"
        detail:
          type: string
          nullable: true
          description: The level, the badge or the health milestone of the entry.
        opponentId:
          type: string
          format: uuid
          nullable: true
          description: Of a duel. The id only; `null` when that account does not exist any more.
        createdAt:
          type: string
          format: date-time
        reactions:
          type: array
          description: The reactions to this entry, oldest first, each with the id of who reacted.
          items:
            $ref: "#/components/schemas/ExportedReaction"
    MilestoneSharing:
      type: string
      description: >
        What friends see of the user's health milestones. `from_two_weeks` (the default): the milestones
        from two weeks on. `private`: none. `all`: also the two short ones (20 minutes, 12 hours).
      enum: [from_two_weeks, private, all]
    Settings:
      type: object
      additionalProperties: false
      required: [milestoneSharing]
      properties:
        milestoneSharing:
          $ref: "#/components/schemas/MilestoneSharing"
    ReachedHealthMilestone:
      type: object
      additionalProperties: false
      required: [key, reachedAt]
      properties:
        key:
          $ref: "#/components/schemas/HealthMilestoneKey"
        reachedAt:
          type: string
          format: date-time
          description: The moment the milestone was reached for the first time.
    BadgeKey:
      type: string
      description: >
        A badge (SRS Appendix B). `limit_halved`: a day kept at half the limit of the first day of the
        plan, or less. `target_reached`: a day kept at a limit that has arrived at the target of the
        plan, in a plan that began above it. `league_champion_*`: rank 1 among at least three, with a
        reduction above zero. The apps have a picture and a text for
        each. A later version of the API may add keys.
      enum:
        - first_check_in
        - first_smoke_free_day
        - check_in_streak_7
        - check_in_streak_30
        - check_in_streak_100
        - check_in_streak_365
        - under_limit_streak_7
        - under_limit_streak_30
        - limit_halved
        - target_reached
        - first_duel_won
        - five_duels_won
        - league_champion_week
        - league_champion_month
        - league_champion_quarter
        - league_champion_half_year
        - cheerleader
    Badge:
      type: object
      additionalProperties: false
      required: [key, awardedAt]
      properties:
        key:
          $ref: "#/components/schemas/BadgeKey"
        awardedAt:
          type: string
          format: date-time
          description: When the badge was stored, which is when the day, the duel or the rank became final.
    Badges:
      type: object
      additionalProperties: false
      required: [badges]
      properties:
        badges:
          type: array
          maxItems: 17
          items:
            $ref: "#/components/schemas/Badge"
    HealthMilestoneKey:
      type: string
      description: >
        A health milestone (SRS Appendix C), by the time since the last session: `heart_rate` 20
        minutes, `carbon_monoxide` 12 hours, `circulation` 2 weeks, `breathing` 30 days,
        `heart_disease_halved` 1 year, `stroke` 5 years, `lung_cancer_halved` 10 years,
        `heart_disease_gone` 15 years. A year counts as 365 days.
      enum:
        - heart_rate
        - carbon_monoxide
        - circulation
        - breathing
        - heart_disease_halved
        - stroke
        - lung_cancer_halved
        - heart_disease_gone
    HealthMilestone:
      type: object
      additionalProperties: false
      required: [key, reachedAt, reached]
      properties:
        key:
          $ref: "#/components/schemas/HealthMilestoneKey"
        reachedAt:
          type: string
          format: date-time
          description: The moment the milestone is reached, or was, if no session is logged before it.
        reached:
          type: boolean
    HealthMilestones:
      type: object
      additionalProperties: false
      required: [since, vapingOnly, milestones]
      properties:
        since:
          type: string
          format: date-time
          nullable: true
          description: The user's last logged session. Null when no session is logged.
        vapingOnly:
          type: boolean
          description: >
            True when every logged session was vaping (without a log: when the plan names vaping). The
            milestones are written for smoking, and the apps then say that the evidence differs.
        milestones:
          type: array
          maxItems: 8
          description: Every milestone in the order of `HealthMilestoneKey`. Empty when `since` is null.
          items:
            $ref: "#/components/schemas/HealthMilestone"
    FriendRequest:
      type: object
      additionalProperties: false
      required: [user, requestedAt]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        requestedAt:
          type: string
          format: date-time
    FriendOverview:
      type: object
      additionalProperties: false
      required: [friends, incoming, outgoing]
      properties:
        friends:
          type: array
          maxItems: 50
          description: By name, without regard to capitals.
          items:
            $ref: "#/components/schemas/Friend"
        incoming:
          type: array
          description: Requests the user can accept or decline, oldest first. `user` is who asked.
          items:
            $ref: "#/components/schemas/FriendRequest"
        outgoing:
          type: array
          maxItems: 50
          description: Requests the user has sent and can take back, oldest first. `user` is who was asked.
          items:
            $ref: "#/components/schemas/FriendRequest"
    FriendRequestRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/InviteCode"
    FriendRequestSent:
      type: object
      additionalProperties: false
      required: [status, user]
      properties:
        status:
          type: string
          enum: [pending, accepted]
          description: "`accepted` when the owner of the code had asked the user before."
        user:
          $ref: "#/components/schemas/PublicUser"
    UserReference:
      type: object
      additionalProperties: false
      required: [userId]
      description: Names another user. The id is sent in the body, never in a URL (URLs end up in server logs).
      properties:
        userId:
          type: string
          format: uuid
    BlockedUserList:
      type: object
      additionalProperties: false
      required: [blocked]
      properties:
        blocked:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [user, blockedAt]
            properties:
              user:
                $ref: "#/components/schemas/PublicUser"
              blockedAt:
                type: string
                format: date-time
    ExportedInvite:
      type: object
      additionalProperties: false
      required: [code, createdAt]
      properties:
        code:
          type: string
        createdAt:
          type: string
          format: date-time
    ExportedFriend:
      type: object
      additionalProperties: false
      required: [userId, status, requestedByMe, requestedAt, acceptedAt]
      description: A friendship or an open friend request. Of the other user the export holds the id only.
      properties:
        userId:
          type: string
          format: uuid
          description: The other user.
        status:
          type: string
          enum: [pending, accepted]
        requestedByMe:
          type: boolean
        requestedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
    ExportedBlock:
      type: object
      additionalProperties: false
      required: [userId, blockedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: The user who was blocked.
        blockedAt:
          type: string
          format: date-time
    DuelReference:
      type: object
      additionalProperties: false
      required: [duelId]
      properties:
        duelId:
          type: string
          format: uuid
    DuelProposal:
      type: object
      additionalProperties: false
      required: [opponentId, periodDays]
      properties:
        opponentId:
          type: string
          format: uuid
          description: A friend.
        periodDays:
          $ref: "#/components/schemas/DuelPeriod"
    DuelPeriod:
      type: integer
      enum: [7, 30, 90, 180]
      description: One week, one month, three months or six months (SRS FR-COMP-01).
    DuelStatus:
      type: string
      enum: [proposed, active, declined, expired, cancelled, completed, forfeited]
      description: >
        `proposed`: waits for the friend. `active`: accepted, running or waiting for its last days to
        become final. `declined`, `expired` (72 hours without an answer). `cancelled`: the two stopped
        being friends while it ran. `completed`: decided. `forfeited`: the account of the opponent was
        deleted while it ran. Only `completed` has a result and XP.
    DuelSide:
      type: object
      additionalProperties: false
      required: [reductionPercent, smokeFreeDays, checkIns, countedDays]
      description: >
        One side of a duel. The user's own side counts the days up to yesterday, and today once it is
        checked in. The opponent's side counts FINAL days only (two days old, and not to be changed by
        anybody any more). Nothing in it tells how much was smoked: the reduction is relative to a
        baseline that is never shown, and is given in whole percent.
      properties:
        reductionPercent:
          type: integer
          maximum: 100
          nullable: true
          description: >
            `null` for the opponent while the duel runs: then only `standing` says who is ahead. A figure
            that moves every day could be calculated back, day by day. For the user's own side, and for
            both sides once the duel is decided:
            in whole percent, rounded (a half away from zero). Negative when more was smoked than the
            baseline. A day without a check-in counts as the baseline, or as what was logged when that is
            more (SRS FR-COMP-03). Whole numbers on purpose: an exact figure could be calculated back to
            the baseline and the counts.
        smokeFreeDays:
          type: integer
          minimum: 0
        checkIns:
          type: integer
          minimum: 0
        countedDays:
          type: integer
          minimum: 1
    Duel:
      type: object
      additionalProperties: false
      required: [id, status, periodDays, challenger, opponent, createdAt, expiresAt, startsOn, endsOn, mine, theirs, standing, outcome, xp, provisional]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DuelStatus"
        periodDays:
          $ref: "#/components/schemas/DuelPeriod"
        challenger:
          type: boolean
          description: "`true` when the user proposed the duel."
        opponent:
          allOf:
            - $ref: "#/components/schemas/PublicUser"
          nullable: true
          description: "`null` when the two are not friends any more, or the account is gone."
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Until when a proposal can be accepted.
        startsOn:
          type: string
          format: date
          nullable: true
          description: The first day of the duel in the user's own calendar. `null` before the duel is accepted.
        endsOn:
          type: string
          format: date
          nullable: true
          description: The last day of the duel in the user's own calendar.
        mine:
          allOf:
            - $ref: "#/components/schemas/DuelSide"
          nullable: true
          description: "`null` while no day counts yet, and for a duel that never ran or ended without a result."
        theirs:
          allOf:
            - $ref: "#/components/schemas/DuelSide"
          nullable: true
          description: As `mine`, and `null` whenever `opponent` is.
        standing:
          allOf:
            - $ref: "#/components/schemas/Standing"
          nullable: true
          description: >
            Where the user stands in a running duel, over the final days of both sides, once both have
            one. A user can still change the own open days, so they do not count here: otherwise the
            answer could be found out by trying. `null` before that, for every duel that is not running,
            and whenever `opponent` is.
        outcome:
          type: string
          enum: [won, draw, lost]
          nullable: true
          description: Of a completed duel. More reduction wins, then more smoke-free days, then more check-ins.
        xp:
          type: integer
          minimum: 0
          nullable: true
          description: >
            What the user earned with a completed duel. 0 without a reduction above zero of the user's own
            side, also for a duel that was won: an app does not celebrate a reward then.
        provisional:
          type: boolean
          description: >
            `true` while the duel runs: the sides count the days up to yesterday, and today once it is
            checked in, and can still change. `false` for a completed duel.
    DuelList:
      type: object
      additionalProperties: false
      required: [duels]
      properties:
        duels:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Duel"
    DuelDetail:
      type: object
      additionalProperties: false
      required: [duel, days]
      properties:
        duel:
          $ref: "#/components/schemas/Duel"
        days:
          type: array
          maxItems: 180
          description: >
            One entry per day of a running or completed duel, in order. Empty for every other duel.
          items:
            type: object
            additionalProperties: false
            required: [day, mine, theirs]
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 180
              mine:
                allOf:
                  - $ref: "#/components/schemas/DuelDayLevel"
                nullable: true
                description: The level of that day. `null` while the day does not count yet.
              theirs:
                allOf:
                  - $ref: "#/components/schemas/DuelDayLevel"
                nullable: true
                description: As `mine`, for final days only, and `null` whenever `opponent` is.
    Standing:
      type: string
      enum: [ahead, level, behind]
      description: >
        The user against the opponent over the days that count so far: more reduction is ahead (compared
        exactly, not as rounded percent), then more smoke-free days, then more check-ins. `level` when all
        three are equal.
    DuelDayLevel:
      type: string
      enum: [smoke_free, well_under, under, not_under]
      description: >
        How a duel day went, in four levels and never as a number. `smoke_free`: checked in without a
        session. `well_under`: checked in with at most half of the frozen baseline. `under`: checked in
        below the baseline. `not_under`: at or over the baseline, or not checked in.
    ExportedDuel:
      type: object
      additionalProperties: false
      required: [id, status, periodDays, role, opponentId, createdAt, expiresAt, answeredAt, startsOn, decidedAt, outcome, result, rulesVersion]
      description: A duel of the user with the user's own side. Of the opponent the export holds the id and nothing else.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DuelStatus"
        periodDays:
          $ref: "#/components/schemas/DuelPeriod"
        role:
          type: string
          enum: [challenger, opponent]
        opponentId:
          type: string
          format: uuid
          nullable: true
          description: "`null` when that account was deleted."
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        answeredAt:
          type: string
          format: date-time
          nullable: true
        startsOn:
          type: string
          format: date
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        outcome:
          type: string
          enum: [won, draw, lost]
          nullable: true
        result:
          type: object
          additionalProperties: false
          nullable: true
          required: [baseline, actual, expected, smokeFreeDays, checkIns, xp]
          description: The user's own side of a completed duel, as it was scored.
          properties:
            baseline:
              type: number
              description: The frozen baseline of the duel, sessions per day.
            actual:
              type: number
              description: The sessions that counted over the duel.
            expected:
              type: number
              description: Baseline times days.
            smokeFreeDays:
              type: integer
              minimum: 0
            checkIns:
              type: integer
              minimum: 0
            xp:
              type: integer
              minimum: 0
        rulesVersion:
          type: string
          nullable: true
    LeaguePeriodType:
      type: string
      enum: [week, month, quarter, half_year]
    League:
      type: object
      additionalProperties: false
      required: [type, period, startsOn, endsOn, final, entries, award]
      properties:
        type:
          $ref: "#/components/schemas/LeaguePeriodType"
        period:
          type: string
          description: The key of the period, e.g. `2026-W47`.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        final:
          type: boolean
          description: "`true` once the user's own rank for the period is stored."
        entries:
          type: array
          maxItems: 51
          description: >
            The user and their friends. Once `final`: in ranking order. Before: the friends who are ahead,
            the user, the friends who are level, the friends who are behind, each group by name. Those
            without a day that counts come last, by name.
          items:
            $ref: "#/components/schemas/LeagueEntry"
        award:
          allOf:
            - $ref: "#/components/schemas/LeagueAward"
          nullable: true
          description: The user's stored rank and reward. `null` until `final`.
    LeagueEntry:
      type: object
      additionalProperties: false
      required: [rank, standing, user, you, reductionPercent, smokeFreeDays, checkIns, countedDays]
      properties:
        rank:
          type: integer
          minimum: 1
          nullable: true
          description: >
            While the league is not `final`: only the user's own entry has a rank, one more than the number
            of friends who are ahead, once the user has a final day. Once it is `final`: everybody with a
            final result. `null` otherwise.
        standing:
          allOf:
            - $ref: "#/components/schemas/Standing"
          nullable: true
          description: >
            Of a friend while the league is not `final`: where the friend stands against the user. Friends
            are not ranked against each other then: a rank among chosen friends could be turned back into
            a percentage. `null` for the user's own entry, once the league is `final`, and while one of the
            two has no day that counts.
        user:
          $ref: "#/components/schemas/PublicUser"
        you:
          type: boolean
          description: "`true` for the user's own entry."
        reductionPercent:
          type: integer
          maximum: 100
          nullable: true
          description: >
            In whole percent. For a friend only once the league is `final` and the friend has a final
            result over at least 7 counted days; `null` otherwise. The user's own is always there when a day
            counts.
        smokeFreeDays:
          type: integer
          minimum: 0
          nullable: true
        checkIns:
          type: integer
          minimum: 0
          nullable: true
        countedDays:
          type: integer
          minimum: 1
          nullable: true
    LeagueAward:
      type: object
      additionalProperties: false
      required: [rank, participants, xp]
      description: As it was decided, among the friends of that moment. It is not recalculated.
      properties:
        rank:
          type: integer
          minimum: 1
        participants:
          type: integer
          minimum: 1
          description: The user and the friends who had a result.
        xp:
          type: integer
          minimum: 0
          description: Rank 1 to 3 among at least three participants earns XP, for a result with a reduction above zero.
    XpLeague:
      type: object
      additionalProperties: false
      required: [period, startsOn, endsOn, entries]
      properties:
        period:
          type: string
          description: The key of the user's current ISO week, e.g. `2026-W47`.
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        entries:
          type: array
          maxItems: 51
          items:
            type: object
            additionalProperties: false
            required: [rank, user, you, xp]
            properties:
              rank:
                type: integer
                minimum: 1
              user:
                $ref: "#/components/schemas/PublicUser"
              you:
                type: boolean
              xp:
                type: integer
                minimum: 0
    ExportedLeagueResult:
      type: object
      additionalProperties: false
      required: [type, period, baseline, actual, expected, smokeFreeDays, checkIns, countedDays, rulesVersion, scoredAt, rank, participants, xp, rankedAt]
      description: The user's own final result of a period, as it was scored, and the rank once it is decided.
      properties:
        type:
          $ref: "#/components/schemas/LeaguePeriodType"
        period:
          type: string
        baseline:
          type: number
          description: The frozen baseline of the period, sessions per day.
        actual:
          type: number
        expected:
          type: number
        smokeFreeDays:
          type: integer
          minimum: 0
        checkIns:
          type: integer
          minimum: 0
        countedDays:
          type: integer
          minimum: 1
        rulesVersion:
          type: string
        scoredAt:
          type: string
          format: date-time
        rank:
          type: integer
          minimum: 1
          nullable: true
        participants:
          type: integer
          minimum: 1
          nullable: true
        xp:
          type: integer
          minimum: 0
          nullable: true
        rankedAt:
          type: string
          format: date-time
          nullable: true
    Problem:
      description: RFC 9457 problem details
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: >
            Stable, machine-readable identifier of the kind of problem. General ones: `bad_request`,
            `malformed_json`, `unauthorized`, `forbidden`, `not_found`, `method_not_allowed`,
            `payload_too_large`, `unsupported_media_type`, `validation_failed`, `rate_limited`,
            `internal_error`, `service_unavailable`. Of the auth operations: `invalid_credentials`,
            `invalid_token`, `invalid_refresh_token`. `invalid_credentials` is also the
            answer to a wrong password in `deleteMe` and in `verifyEmail`. Of the logging operations:
            `plan_required`, `day_finalized`, `day_in_future`, `day_before_start`. New slugs may be
            added at any time.
          example: not_found
        title:
          type: string
          description: Short, human-readable summary in English. The same for every problem of one type.
          example: Not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code of this response
          example: 404
        detail:
          type: string
          description: Human-readable explanation of this occurrence, in English. Not for display to users.
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: >
            Name of the request field, with a dot for nested fields (`consents.age18.version`). Empty
            when the problem is the request body as a whole.
          example: email
        code:
          type: string
          enum: [required, unknown_field, wrong_type, too_short, too_long, out_of_range, invalid_format,
                 invalid_value, not_accepted, must_be_below_baseline, baseline_already_set,
                 goal_target_mismatch, ambiguous, outdated_version]
          description: >
            Stable, machine-readable reason. Clients decide and translate by this code, never by `message`.
            `required`: the member is missing. `unknown_field`: the operation has no such member.
            `wrong_type`: another JSON type than documented (a whole number must be a JSON integer: `12.0`
            and `"12"` are not). `too_short` / `too_long`: the length of a text. `out_of_range`: a number
            outside its range. `invalid_format`: text that is not built as required (not an email address,
            forbidden characters). `invalid_value`: not one of the values to choose from (avatar, language,
            time zone, mode). `not_accepted`: a consent that was not given. `must_be_below_baseline`: a
            `reduce` target that is not below the current baseline. `baseline_already_set`: a
            `startingBaseline` other than the one of the onboarding. `goal_target_mismatch`: `quit` with a
            target other than 0, or `reduce` to 0. `ambiguous`: the refresh token came in the body and in
            the cookie. `outdated_version`: a consent to another version of a text than the one in force
            (`GET /legal/consents`): the app shows an old text and has to be updated. A code is never
            renamed or removed. New ones may be added: treat an unknown code
            like a generic "invalid".
          example: invalid_format
        message:
          type: string
          description: What is wrong with the field, in English, for developers. Not for display, and it may be reworded.
          example: Must be an email address.
    ValidationProblem:
      description: RFC 9457 problem details of a rejected request body, with one entry per invalid field
      type: object
      additionalProperties: false
      required: [type, title, status, errors]
      properties:
        type:
          type: string
          enum: [validation_failed]
        title:
          type: string
        status:
          type: integer
          enum: [422]
        detail:
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
  responses:
    BadRequest:
      description: >
        The request cannot be read: `malformed_json` (the body is not a JSON object) or `bad_request`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: >
        `unauthorized`: the access token is missing, invalid or expired, its account was deleted, or the
        password was reset since it was issued. Refresh the session and repeat the request once.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The request is understood but not allowed (`forbidden`, or a more specific type).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: There is no such resource (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The path exists, but not with this method (`method_not_allowed`).
      headers:
        Allow:
          description: The methods the path supports
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body is larger than the 64 KiB the server accepts (`payload_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not `application/json` (`unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: The request body is readable, but one or more fields are invalid (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    TooManyRequests:
      description: Too many requests in a short time (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Something went wrong on the server (`internal_error`). The response carries no internal detail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >
        `service_unavailable`: the request could not be handled right now, through no fault of the client.
        Either a part the service depends on (the database) cannot be reached, or the database gave this
        request up for the moment because another request held what it needed for too long (with
        `Retry-After`). Nothing the request did was stored, except that it counts towards the rate limits.
        Repeat the same request after a short wait, with back-off.
      headers:
        Retry-After:
          description: Seconds to wait before repeating the request. Present when the server can tell.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlanRequired:
      description: "`plan_required`: the user has not done the onboarding (`PUT /me/plan`) yet."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DayNotOpen:
      description: >
        The day cannot be checked in: `day_finalized` (it is final), `day_in_future` (it has not begun
        for the user) or `day_before_start` (it is before the first day of the plan). Or `plan_required`:
        the user has not done the onboarding yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidToken:
      description: >
        `invalid_token`: the token of the mail link is unknown, expired or already used (one answer for all
        three), or, for a confirmation link, was deleted after five wrong passwords. Also `malformed_json`
        or `bad_request` when the request cannot be read.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidCredentials:
      description: >
        `invalid_credentials`: the email address is unknown, the password is wrong, or the registration is
        not confirmed yet (one answer for all three, so that nobody can find out who is registered). Show
        the same message in every case and offer "Resend confirmation link" (`POST
        /auth/resend-verification`) next to it: a user who registered and never confirmed needs exactly that.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    WrongSignUpPassword:
      description: >
        `invalid_credentials`, the type of a failed login. On `verifyEmail` it means: the link is fine, but
        the password is not the one of the sign-up it belongs to. Either the user mistyped (let them try
        again, the link survives four wrong passwords), or somebody else registered this address after
        them (offer "sign up again": that replaces the other registration and mails a new link). The
        response says nothing about the registration.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRefreshToken:
      description: >
        `invalid_refresh_token`: the refresh token is missing, unknown, expired, revoked, or an older token
        of its login that was replaced more than 10 seconds ago (one answer for all). The user has to log
        in again.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/RefreshCookie"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnauthorizedOrWrongPassword:
      description: >
        Either `unauthorized`: the access token is missing, invalid or expired (refresh it and try again).
        Or `invalid_credentials`: the access token is fine, but the password in the body is wrong (ask the
        user again; refreshing the token does not help).
      headers:
        WWW-Authenticate:
          description: "`Bearer`, with `unauthorized` only."
          schema:
            type: string
            enum: [Bearer]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InviteNotFound:
      description: >
        `invite_not_found`: nobody the user can ask has this invite code. Either it does not exist (any
        more), or one of the two has blocked the other.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FriendRequestRefused:
      description: >
        `own_invite` (the code is the user's own), `already_friends`, or `friend_limit_reached`: the user
        has 50 friends and own open requests already (SRS FR-FRND-04).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FriendLimitReached:
      description: >
        `friend_limit_reached`: the user has 50 friends and own open requests already (SRS FR-FRND-04).
        How many friends the other user has never decides.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FriendRequestNotFound:
      description: "`friend_request_not_found`: there is no open friend request between the two in this direction."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FeedEntryNotFound:
      description: >
        `feed_entry_not_found`: there is no such entry in the feed of the user. The answer is the same
        for an entry that does not exist and for one the user may not see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OwnFeedEntry:
      description: "`own_feed_entry`: nobody reacts to an own entry."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FriendNotFound:
      description: >
        `friend_not_found`: the user is not a friend (and, for a block, has no open request with this
        user either). The answer for a user id that does not exist is the same.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BlockNotFound:
      description: "`block_not_found`: the user has not blocked this user."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DuelNotFound:
      description: "`duel_not_found`: the user has no duel with this id. The answer for an id that does not exist is the same."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DuelNotOpen:
      description: >
        `duel_not_open`: the duel is not a proposal any more (answered, expired or taken back), or this is
        not for the user to do: only the one who was challenged answers, only the challenger takes back.
        For an acceptance also `plan_required` (the onboarding is not done) and `duel_limit_reached` (the
        user has 5 open duels already).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DuelRefused:
      description: >
        `plan_required`: the user has not done the onboarding. `duel_exists`: there is an open duel with
        this friend already, whoever proposed it. `duel_limit_reached`: the user has 5 open duels already
        (SRS FR-COMP-05).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LeagueNotFound:
      description: "`league_not_found`: the period has not begun for the user."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

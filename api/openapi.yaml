        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /logs/sync:
    post:
      operationId: syncLogs
      tags: [Logging]
      summary: Send logs and deletions from the app's outbox (SRS FR-LOG-02, FR-LOG-03)
      description: >
        Up to 200 items, applied in order. An item with `smokedAt`, `productType` and `count` stores a
        log under the id the app gave it, or corrects the log of that id. An item with `deleted: true`
        and nothing else deletes the log of that id. Sending an item again changes nothing, so a batch
        can be repeated until its answer has arrived.


        Every item gets its own entry in `results`, in the order of the request: `accepted`, or
        `rejected` with a `reason`. A rejected item will be rejected again: the app takes it out of its
        outbox and tells the user why (SRS FR-LOG-07). `days` holds the days of the accepted items as
        they are now, oldest first.


        The server works out the local day of a log from `smokedAt`. A day holds at most 300 sessions.
        A deleted log stays deleted: a later item for its id is accepted and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSyncRequest"
      responses:
        "200":
          description: The answer for every item, and the days that were touched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PlanRequired"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

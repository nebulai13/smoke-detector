openapi: 3.0.3
info:
  title: Smoke Detector API
  version: 0.1.0
  description: |
    Single source of truth for the HTTP contract (HLD AD-4). Endpoints are added here first, in the
    build step that implements them. Every backend HTTP test validates its request and its response
    against this file, so an endpoint, status code or field that is not written down here fails the tests.

    Conventions:

    - **Version.** OpenAPI 3.0.3, not 3.1 (HLD AD-4): write `nullable: true`, not `type: [x, "null"]`.
    - **Errors.** Every error response is RFC 9457 `application/problem+json` (schema `Problem`). Clients
      decide by the stable `type` slug (for example `validation_failed`), never by `title` or `detail`.
      Reuse the entries of `components/responses`.
    - **Authentication.** Every operation needs a bearer access token (`security` below). A public
      operation says so explicitly with `security: []`.
    - **Closed objects.** Every object schema sets `additionalProperties: false`. That is what makes
      an undocumented response field fail the contract tests.
    - **No personal or health data in URLs.** It goes into the JSON body.
    - **Request bodies.** JSON objects of at most 64 KiB (65536 bytes), sent as `application/json`. A
      larger body is answered with 413 `payload_too_large`. A whole number must be a JSON integer:
      `12.0`, `1e1` and `"12"` are rejected with `wrong_type`. Text lengths are counted in Unicode code
      points (an emoji may count as several), not in bytes or UTF-16 units.
    - **Every response** carries `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`,
      `Strict-Transport-Security` and a `Content-Security-Policy` that allows nothing.
    - **Temporary failures.** 503 `service_unavailable` can be the answer of every operation (database
      not reachable, or the request was given up for the moment). It means "repeat the same request
      after a short wait", honouring `Retry-After` when present. 500 `internal_error` is a bug.

    Notes for client developers (what follows from the rules above and is easy to miss):

    - **Login errors.** `invalid_credentials` also covers "right password, address not confirmed yet".
      Show one message and always offer "Resend confirmation link".
    - **Login limits lock the one who guesses, not the account.** Failed password checks (`login`,
      `deleteMe`, and wrong passwords in `verifyEmail` for the first rule) are counted three ways:
      30 per quarter of an hour per client over all addresses, 5 per quarter of an hour per pair of
      email address and client, and 50 per hour per email address over all clients. A 429 therefore
      nearly always means "this device tried too often": show the wait from `Retry-After` (up to 15
      minutes). Somebody else's wrong guesses do not lock the owner out. Only the third rule can
      (guessing from many clients at once, `Retry-After` up to an hour): then mention the password
      reset, which clears that count. The 429 does not say which rule was hit. "Client" is the
      address the request comes from, so the devices behind one router or one mobile carrier
      gateway count as one client.
    - **Mail limits.** `register`, `resendVerification` and `requestPasswordReset` share one budget: 5
      requests per hour per client, and 3 per hour per pair of email address and client (429 for
      both). Register plus two resends from one device leaves that device no reset request for that
      address in that hour. Over all clients an address gets at most 10 such mails per hour: above
      that the request is still answered with 202, and no mail is sent and nothing is changed. So
      "check your inbox" can stay empty for up to an hour when somebody floods an address: say "it
      can take a while, try again later" rather than promising the mail.
    - **Mails take a minute or two.** No request sends its mail itself. `register`,
      `resendVerification`, `requestPasswordReset` and a `login` that triggers a confirmation mail
      only queue it, and a job that runs every minute sends it. So the 202 means "a mail is on its
      way", not "a mail has arrived". Show: "the mail can take a minute or two", and do not offer
      "send again" as the first thing to do about an empty inbox: every resend counts towards the
      mail limits and makes the link of the earlier mail stop working. When the mail server does
      not take the mail, it is tried again 1, 5, 15 and 60 minutes later. It is dropped after the
      fifth failed try (about 80 minutes after the request), and earlier when the next try would
      come after its link has expired (24 hours for a confirmation, 1 hour for a reset, both
      counted from the request: a reset mail is given up after about 20 minutes of failed tries).
      The user then has to ask again. The response never tells whether a mail was queued.
    - **Mail links.** The mails link to the web app: `/verify-email?token=…` and
      `/reset-password?token=…` (and, in the "you already have an account" mail, `/login` and
      `/reset-password`). The web app reads the token, removes it from the address bar at once
      (`history.replaceState`), sends no referrer from these pages, and posts the token in the JSON body.
      Native apps that register these paths as universal / app links do the same.
    - **Confirmation page.** `/verify-email?token=…` asks for the password chosen at sign-up and posts
      token and password to `verifyEmail`. A 200 is a login: keep the session as after `login`, there is
      no second step. `invalid_credentials` there means "this is not the password of this sign-up": let
      the user try again and offer "sign up again" next to it, because somebody else may have registered
      the address after them (their own sign-up was replaced, and only a new one brings it back). The
      fifth wrong password deletes the link (`invalid_token` from then on). The mail tells the user
      that the page asks for the password.
    - **Used links.** `verifyEmail` and `confirmPasswordReset` answer the same `invalid_token` for an
      unknown, an expired and a used token. After `invalid_token` on the confirmation page, offer login
      and "Resend confirmation link" rather than only "link invalid": a second click may have used the
      link already. (A mail scanner that only opens the link cannot use it up any more: without the
      password nothing happens.)
    - **Password reset for an unconfirmed registration** sends no mail (the reset must not activate an
      account). The UI text is "if this address has an account, a mail is on its way (it can take a
      minute or two)", plus the resend offer.
    - **Refresh.** A refresh replaces the refresh token. For 10 seconds after that, presenting the
      token that was just replaced is answered like a successful refresh that carries the **same** new
      refresh token again (and a fresh access token). So two tabs that refresh at the same moment,
      and a retry after a lost answer, are harmless: always store the refresh token of the answer
      you get, whichever arrives last. Retry a refresh that got no answer at once, not minutes
      later: after the 10 seconds, and for any token older than the one just replaced, the old
      token ends the session and the user logs in again (theft detection). Serialising refreshes
      across tabs (Web Locks or a BroadcastChannel) is still good practice, but no longer needed
      for correctness. `Session.expiresIn` is the life of the access token only. The refresh token
      lives 60 days from its last use.
    - **Logout and access tokens.** Logout ends the refresh token of the device. The access token it
      last got keeps working until it expires (at most 15 minutes): discard it. A password reset and an
      account deletion end the access tokens at once.
    - **Cookie mode.** The refresh cookie is `Secure` with `Path=/api/v1/auth`: it is not stored over
      plain `http://localhost` in every browser, and a development proxy must keep the path. Production
      runs on a subdomain of a shared registrable domain: `SameSite=Strict` does not protect against
      requests from sibling subdomains. A second `refresh_token` cookie set from there makes the server
      ignore both (401, and its own cookie is cleared).
    - **Consent texts.** The app ships the three consent texts with their versions. Before showing
      the registration form it asks `getConsentVersions`. When a version differs from its own, the
      texts in the app are out of date: tell the user to update the app (the web app: reload) and do
      not offer the form. `register` sends, per consent, `accepted: true` and the version of the text
      that was on screen. `outdated_version` on `consents.<name>.version` is the same situation,
      found late (the text changed while the form was open). Asking existing users again after a
      text changed is not part of this version of the contract.
    - **Not in v1 of the contract yet:** changing the email address or the password while logged in
      (use the password reset), and a list of sessions. `DELETE /me` needs a JSON body with the password.
    - **Health.** `cronLastRunAt` of `/health` is the end of the last run of the cron job in which
      every step worked (the job that sends the mails runs every minute). It is `null` before the
      first such run, and on an installation that keeps no heartbeat (local development).
servers:
  - url: /api/v1
    description: >
      Same origin as the web app (HLD AD-9). Production: https://smoke-detector.witch13.org/api/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: Operations for monitoring and deployment
  - name: Legal
    description: What an app has to know about the consent texts before it shows the registration form.
  - name: Auth
    description: >
      Registration (confirm first), login, token refresh, logout and password reset (HLD §4.5). All of
      them are public: they are how a client gets a token in the first place.
  - name: Friends
    description: >
      Invite code, friend requests, friends and blocks (HLD §4.7). Friends see aggregates of each other
      and nothing else (SRS FR-FRND-03).
  - name: Competition
    description: >
      Duels with one friend (HLD §4.8) and leagues with all friends (HLD §4.9). Everybody is rated over
      their own local days, against a baseline that is frozen at the start and never shown to others.
  - name: Social
    description: >
      The activity feed of the user and the user's friends (HLD §4.12). Written from final data only,
      and shown without times.
  - name: Progress
    description: >
      What the logged-in user has reached (HLD §4.10): badges and health milestones. Friends see which
      badges a friend holds and never when they were earned (SRS FR-FRND-03).
  - name: Me
    description: >
      The account of the logged-in user: profile, reduction plan, data export and deletion (HLD §4.5
      "Account"). The user is always the one the access token belongs to. No operation takes a user id.
  - name: Logging
    description: >
      Logs, check-in and the days of the logged-in user (HLD §4.6). All of them need the onboarding:
      before it they answer `409` `plan_required`. A day is a local day of the user, worked out by the
      server. It is final 48 hours after it ended; until then its logs can be corrected.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness check (database + cron heartbeat)
      description: >
        Used by the deploy smoke test and by monitoring. Answers 200 only when the database can be
        reached. The cron heartbeat (`cronLastRunAt`) is reported but not judged yet: a heartbeat that
        is minutes old means that mails are not being sent, and the answer is still 200.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /legal/consents:
    get:
      operationId: getConsentVersions
      tags: [Legal]
      summary: The versions of the three consent texts that are in force
      description: >
        A registration carries, for each consent, the version of the text the app showed, and is accepted
        only when that is the version answered here (`outdated_version` otherwise). Ask before showing
        the registration form: when the app's own texts have another version, tell the user to update
        the app instead of letting the registration fail at its end. Public, and answered from the
        configuration alone, also while the database is down.
      security: []
      responses:
        "200":
          description: The versions in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentVersions"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register (always answers "check your inbox")
      description: >
        Always answers 202 for a valid request, whether or not the email address already has an account,
        so nobody can find out who is registered. A new address is mailed a confirmation link (valid
        24 hours from this request). The mail is queued by this request and sent within a
        minute or two, never by the request itself. The account cannot be used before `POST /auth/verify-email` was called with the token of
        that link and the password of this registration. Each of the three consents is sent with the version
        of the text the app showed, and that must be the version in force (`GET /legal/consents`):
        otherwise the answer is 422 with `outdated_version` on `consents.<name>.version`, and nothing is
        stored. An address that already has a confirmed account is mailed a note saying so, and that
        account is not changed. Registering an unconfirmed address again replaces the earlier
        registration (password, profile and consents), only the newest link works, and the 24 hours start
        again. A registration that is not confirmed within 24 hours of its newest link is deleted. Limited to 5
        requests per hour and client and 3 per hour for one email address from one client (429), counted
        together with `resendVerification` and `requestPasswordReset`. Over all clients an email address is
        mailed at most 10 times per hour by these three: above that the answer is still 202, but no mail is
        sent and nothing is stored or replaced.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: >
            Accepted. A mail to the address is on its way and goes out within a minute or two (none
            when the address has had its mails for this hour, see the description).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Confirm the email address with the link's token and the sign-up password, and log in
      description: >
        The page behind the confirmation link asks for the password that was chosen at sign-up and sends
        it here together with the token of the link. The account is confirmed only when the token is valid
        **and** the password is the one of the registration the link belongs to. The link alone confirms
        nothing: anybody can register any address, and the newest link always belongs to the newest
        submission, so without the password the owner of the mailbox could activate a stranger's
        password. On success the account is confirmed and the user is **logged in**: the answer is the one
        of `login`, with `refreshIn` and `deviceLabel` meaning the same. A token works once and for 24
        hours. An unknown, expired or used token gives the same `invalid_token`, and so does a token whose
        registration is older than 24 hours; this is decided before the password is looked at. A valid
        token with a wrong password gives 401 `invalid_credentials`, which on this operation means "the
        password is not the one of this sign-up": nothing is confirmed, nobody is logged in, and the answer
        carries nothing of the registration (no address, no name). The token stays usable, so the user can
        try again, but the fifth wrong password deletes it and every later attempt is `invalid_token`.
        A wrong password also counts as a failed login of the client (see `login`): a client over that
        limit gets 429, also with the right password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: The email address is confirmed and the user is logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidToken"
        "401":
          $ref: "#/components/responses/WrongSignUpPassword"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Auth]
      summary: Send the confirmation link again (always answers 202)
      description: >
        Always answers 202 for a valid request. An unconfirmed registration gets a new link that is valid
        for 24 hours, the older one stops working, and the registration is kept for those 24 hours. A
        registration that was not confirmed within 24 hours of its last link gets nothing: it has to be
        submitted again. A confirmed account is mailed a note that it exists. Any other address gets no
        mail. Nobody learns from the response which of these it was. A mail is queued by this request and
        sent within a minute or two. Rate limits as for `register`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with email address and password
      description: >
        Answers with an access token (JWT, 15 minutes) and a refresh token (60 days, replaced by every refresh).
        Native apps ask for `refreshIn: body` and keep the refresh token in the Keychain / encrypted storage.
        The web app asks for `refreshIn: cookie`: the refresh token then comes only as an `HttpOnly; Secure;
        SameSite=Strict; Path=/api/v1/auth` cookie and is never in the body. Every login that does not succeed
        gets the same `invalid_credentials`: an unknown address, a wrong password, and also a right password
        for a registration that is not confirmed yet. There is deliberately no answer of its own for that
        last case (it would tell who is registered). Instead, the right password for an unconfirmed
        registration makes the server mail a fresh confirmation link (queued by this request and sent within a
        minute or two; at most one per hour per address, and over that the mail is left out without any sign
        in the answer),
        and a client shows "Resend confirmation link" (`resendVerification`) next to every login error.
        Failed logins are counted in fixed windows of the clock, under three rules that are checked in
        this order: per client over all addresses (30 per quarter of an hour: :00, :15, :30, :45), per pair
        of email address and client (5 per quarter of an hour), and per email address over all clients (50
        per clock hour). One failure more than a rule allows, and every login it covers is answered with
        429 until its window ends, also a login with the right password. So five wrong guesses lock the
        client that made them for that address, and nobody else: the owner of the address still logs in
        from any other client. Only the third rule locks an address for everybody, and a successful
        password reset clears its count. An address nobody has is counted exactly like a registered one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Exchange the refresh token for a new access token and a new refresh token
      description: >
        The refresh token is sent in the body (native apps) or comes in the cookie (web app, no body), never
        both. The answer carries the new refresh token the same way. A refresh token is replaced by every
        refresh, and a client must store the new one. For **10 seconds** after a refresh, the token that
        was just replaced is still answered: with 200, the **same** new refresh token as the first answer
        (in cookie mode the same cookie) and a fresh access token, and nothing is replaced a second time.
        Two browser tabs that refresh together, or a client that repeats a refresh whose answer was lost,
        therefore end up with the identical current token, whichever answer arrives last. After the 10
        seconds, and for every older token of the login, theft detection applies: presenting a token that
        is not the current one ends the whole session of that login, and the user has to log in again.
        Every refusal is the same `invalid_refresh_token`. A user keeps at most 20 logins: one more ends the
        one that was unused for the longest time.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new token pair.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Log out on this device
      description: >
        Ends the session the refresh token belongs to. Sessions on other devices stay. The refresh token is
        sent as for `refreshSession`. Answers 204 for every request it can read, also for a token that is
        unknown or no longer valid: the caller wanted to be logged out, and is. (A request that breaks the
        contract is still 422: a `refreshToken` of the wrong type or length, or a token in the body and in
        the cookie at once.) A request that brought the refresh cookie is told to clear it. Needs no access
        token, so it also works after the access token expired. The access token itself is not revoked: it
        keeps working until it expires, at most 15 minutes, and the client discards it.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Ask for a password reset link (always answers 202)
      description: >
        Always answers 202 for a valid request, whether or not the address has an account. A confirmed
        account is mailed a link that is valid for 1 hour from this request. The mail is queued by this
        request and sent within a minute or two. An older link stops working. An unknown address
        and an unconfirmed registration get no mail. Rate limits as for `register`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequested"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      summary: Set a new password with the token of the reset link
      description: >
        Sets the password and signs the user out on **all** devices, at once: every refresh token is revoked
        and every access token issued before is refused from now on (401 `unauthorized`). It does not log
        in. A token works once and for 1 hour. An unknown, expired or used token gives the same
        `invalid_token`. A password that is rejected (422) leaves the token usable. A successful reset also
        clears the failed logins counted for the address over all clients (the third rule of `login`), so
        a flood of wrong guesses cannot keep the owner out any longer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: The password is changed. The user can log in with it now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
        "400":
          $ref: "#/components/responses/InvalidToken"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The profile of the logged-in user, and the reduction plan once onboarding is done
      description: >
        `onboardingComplete` is `false` until `PUT /me/plan` was called for the first time, and `plan` is
        absent until then. With a plan, `plan.baseline` is the current baseline and `plan.dailyLimit` the
        limit that follows from it today (SRS FR-PLAN-01).
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Change display name, avatar, language or time zone
      description: >
        Only the members that are sent are changed, and at least one must be sent. The email address
        cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The account after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteMe
      tags: [Me]
      summary: Delete the account and everything stored about the user, at once
      description: >
        Needs the current password in the body, although the request is authenticated: an access token
        alone must not be enough to destroy an account. Everything the server stores about the user is
        deleted in one step and cannot be restored. Afterwards the access token and every refresh token of
        the user are refused, and the email address can be registered again. A wrong password gives 401
        `invalid_credentials` and deletes nothing. Wrong passwords count as failed logins, in the same
        counters and under the same three rules as `login`, with the email address of the account and the
        client the request comes from: after five wrong passwords from one client in a quarter of an hour
        (at login and here together) that client gets 429, also with the right password. Wrong guesses
        from another client do not keep the owner from deleting the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
      responses:
        "204":
          description: The account is deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedOrWrongPassword"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me/plan:
    put:
      operationId: saveMyPlan
      tags: [Me]
      summary: Set the reduction plan (onboarding) or change it later
      description: >
        The first call is the onboarding: it needs `startingBaseline` and stores it as the first entry of
        the baseline history, valid from today in the user's time zone. Later calls change goal, target,
        taper speed and default product. The baseline cannot be changed by the user any more (it follows
        the weekly update): a later call leaves `startingBaseline` out, or repeats the value of the
        onboarding, so that a repeated onboarding request is harmless. Any other value is rejected. A
        `reduce` target must be below the current baseline whenever the goal is set or changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: The account with the plan as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me/export:
    get:
      operationId: exportMe
      tags: [Me]
      summary: Everything stored about the user, as one JSON document (GDPR Art. 15 and 20)
      description: >
        Never contains the password hash or a token. Limited to 5 exports per hour and account.
      responses:
        "200":
          description: The data of the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me/dashboard:
    get:
      operationId: getDashboard
      tags: [Logging]
      summary: Today's count against the limit, and streaks, XP and level
      description: >
        `today` is the user's local day. `progress` includes the days that are not final yet, as they
        stand: it is `provisional` when that differs from what is stored for good (SRS FR-GAME-06).
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PlanRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me/baseline-history:
    get:
      operationId: getBaselineHistory
      tags: [Logging]
      summary: Every baseline the user ever had, oldest first (SRS FR-PLAN-08)
      description: Empty before the onboarding.
      responses:
        "200":
          description: The baseline history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /feed:
    get:
      operationId: showFeed
      tags: [Social]
      summary: What the user and the user's friends reached lately (SRS FR-SOC-01)
      description: >
        Level-ups, badges, duel results and health milestones, the newest first. An entry is written when
        what it tells is final (a day 48 hours after it ended, a duel when it is decided, a league rank
        when it is stored), and it has no time. A health milestone of a friend is in the feed as far as
        that friend's setting allows (`MilestoneSharing`). The opponent of a duel is named only to
        somebody who is a friend of the opponent too. A lost duel is not announced.
      responses:
        "200":
          description: The newest entries the user may see, at most 50.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /feed/reactions:
    post:
      operationId: reactToFeedEntry
      tags: [Social]
      summary: React to an entry of a friend (SRS FR-SOC-02)
      description: >
        One of three preset reactions, and no text. A user has one reaction to an entry: sent again, it
        changes. A new reaction earns XP, up to a daily maximum (SRS Appendix A). Only an entry the user
        sees in the feed can be reacted to, and never an own one. Reactions and nudges together are limited
        to 30 a day (SRS FR-SOC-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRequest"
      responses:

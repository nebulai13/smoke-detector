      operationId: listDays
      tags: [Logging]
      summary: The days of a range with count, limit and check-in
      description: >
        Every day from `from` to `to` (both included, at most 92 days) that the user has: from the first
        day of the plan to today. A day without a log is listed with a count of 0.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The days, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PlanRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /days/{date}/check-in:
    post:
      operationId: checkInDay
      tags: [Logging]
      summary: Check a day in ("Done for today", SRS FR-LOG-04)
      description: >
        Confirms the count of the day. Possible for today and for every earlier day that is not final.
        A second check-in of the same day changes nothing and gets the same kind of answer. The request
        has no body.


        The answer shows what the day gives as things stand: `events` to celebrate, and `progress` with
        the open days counted in. Both are provisional: the logs of the day can still be corrected until
        it is final, and the check-in stays.
      parameters:
        - name: date
          in: path
          required: true
          description: The local day of the user to check in.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The day is checked in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
        "401":
